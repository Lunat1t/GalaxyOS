<text x="72" y="1175" class="ink">C. Поиск и ответы с источниками</text><text x="72" y="1199" class="sub">Пользователь задаёт вопрос, Galaxy отвечает и показывает подтверждения</text>
<rect x="72" y="1220" width="1456" height="340" rx="18" class="card"/><rect x="72" y="1220" width="1456" height="50" rx="18" class="dark"/><text x="98" y="1252" class="white">API Gateway  /  Спросить о проекте</text><rect x="120" y="1300" width="1360" height="54" rx="12" fill="#f5f6fa" stroke="#d9deea"/><text x="148" y="1334" class="body">Почему здесь используется ротация refresh token?</text><rect x="1370" y="1307" width="96" height="40" rx="8" class="accent"/><text x="1393" y="1333" class="white">Найти</text><text x="120" y="1392" class="small">ОТВЕТ ПО МАТЕРИАЛАМ ПРОЕКТА</text><text x="120" y="1427" class="body">Ротация снижает риск повторного использования похищенного токена.</text><text x="120" y="1454" class="body">При обнаружении старого токена система отзывает связанную сессию.</text><text x="120" y="1494" class="small">ИСТОЧНИКИ (2)</text><rect x="120" y="1510" width="420" height="34" rx="7" class="blue"/><text x="137" y="1533" class="tiny">src/auth/session.py · строки 42–58</text><rect x="555" y="1510" width="420" height="34" rx="7" class="green"/><text x="572" y="1533" class="tiny">Решение #12 · подтверждено командой</text>
