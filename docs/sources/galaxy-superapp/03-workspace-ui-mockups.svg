<rect x="98" y="280" width="900" height="275" rx="12" class="blue"/><text x="126" y="318" class="small">ПРОДОЛЖИТЬ РАБОТУ</text><text x="126" y="354" class="ink">Обновление токена</text><text x="126" y="384" class="body">Вчера проверяли ротацию refresh token. Следующий шаг —</text><text x="126" y="408" class="body">добавить тест на повторное использование старого токена.</text><rect x="126" y="434" width="180" height="42" rx="9" class="accent"/><text x="148" y="461" class="white">Продолжить задачу</text><text x="126" y="511" class="small">Источники: auth/session.py · Решение #12 · запуск run-184</text>
