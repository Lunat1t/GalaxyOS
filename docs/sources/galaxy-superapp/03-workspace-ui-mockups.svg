<text x="72" y="68" class="title">Galaxy — пять гипотез интерфейса проекта</text><text x="72" y="100" class="sub">Один и тот же проект и задача: «Продолжить работу над обновлением токена»</text>
<!-- A workspace dashboard -->
<text x="72" y="160" class="ink">A. Рабочий стол проекта</text><text x="72" y="184" class="sub">Первым экраном показывает состояние и следующий полезный шаг</text>
