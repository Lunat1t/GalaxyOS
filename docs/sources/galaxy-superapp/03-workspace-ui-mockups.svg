<text x="435" y="798" class="small">src/auth/session.py</text><rect x="430" y="820" width="550" height="245" rx="8" class="code"/><text x="454" y="860" class="body">def rotate_refresh_token(token):</text><text x="454" y="892" class="body">    session = find_session(token)</text><text x="454" y="924" class="body">    if session.revoked:</text><text x="454" y="956" class="body">        raise InvalidToken()</text><text x="454" y="1000" class="small">... остальной код ...</text><line x1="1000" y1="760" x2="1000" y2="1100" class="line"/>
<text x="1032" y="798" class="small">КОНТЕКСТ GALAXY</text><text x="1032" y="832" class="ink">Что уже известно</text><rect x="1024" y="850" width="470" height="90" rx="9" class="yellow"/><text x="1042" y="880" class="body">Решение: старые refresh-токены</text><text x="1042" y="904" class="body">должны отзывать всю цепочку.</text><text x="1042" y="925" class="tiny">docs/auth-decisions.md · подтверждено</text><text x="1032" y="977" class="body">Связано: test_rotation.py</text><text x="1032" y="1010" class="body">Показать ещё 4 источника →</text><rect x="1032" y="1035" width="210" height="40" rx="8" class="accent"/><text x="1050" y="1061" class="white">Передать агенту</text>
